[pytest]
testpaths = seleniumWebDriver/TestCases
python_files = TC*.py Test_*.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    Stays: Booking stays and home page flows
    Flights: Booking flights module flows
    CarRental: Booking car rental module flows
    smoke: critical smoke tests
    tenant: retained IOC-style marker compatibility
